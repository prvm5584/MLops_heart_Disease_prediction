name: mlops-ci
on: [push, pull_request]
jobs:
 validate:
  runs-on: ubuntu-latest
  steps:
  - uses: actions/checkout@v4
  - uses: actions/setup-python@v5
    with: {python-version: "3.10", cache: pip}
  - run: pip install -r requirements.txt
  - run: ruff check api tests
  - run: jupyter nbconvert --to notebook --execute Heart_Disease_MLOps_Submit_Ready.ipynb --output executed.ipynb --ExecutePreprocessor.timeout=1200
  - run: pytest -q
  - uses: actions/upload-artifact@v4
    with:
     name: ml-artifacts
     path: |
      executed.ipynb
      models/
      artifacts/
      screenshots/
  - run: docker build -t heart-disease-api:${{ github.sha }} .
