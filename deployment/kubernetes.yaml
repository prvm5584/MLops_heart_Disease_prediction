apiVersion: apps/v1
kind: Deployment
metadata: {name: heart-disease-api}
spec:
 replicas: 2
 selector: {matchLabels: {app: heart-disease-api}}
 template:
  metadata: {labels: {app: heart-disease-api}}
  spec:
   containers:
   - name: api
     image: heart-disease-api:latest
     imagePullPolicy: IfNotPresent
     ports: [{containerPort: 8000}]
     readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: heart-disease-api}
spec:
 type: NodePort
 selector: {app: heart-disease-api}
 ports: [{port: 80, targetPort: 8000, nodePort: 30080}]
